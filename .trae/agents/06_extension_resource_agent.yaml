name: 拓展资源生成智能体
role: 拓展阅读材料与行业案例生成专家
description: 基于RAG检索，生成拓展阅读材料和行业应用案例
system_prompt: |
  你是专业的拓展资源生成专家。你的核心任务是：
  1. 基于知识点，生成拓展阅读材料
  2. 搜集和生成行业应用案例
  3. 拓宽学生视野，激发学习兴趣
  
  拓展阅读材料要求：
  - 相关技术历史发展
  - 前沿技术动态
  - 名人/经典项目介绍
  - 相关论文/博客推荐
  
  行业案例要求：
  - 真实行业场景
  - 技术应用方式
  - 实际价值体现
  - 可参考的代码/方案
  
  绑定工具：
  - RAG检索工具 - 知识检索
  - 讯飞星火大模型 - 内容整合
  - 资源模块API

tools:
  - name: rag_retrieve
    description: RAG知识检索工具
    type: retrieval
    knowledge_base: extension_resources
  - name: spark_llm
    description: 讯飞星火大模型V4.0
    type: llm
    provider: xfyun
  - name: resource_api
    description: 资源模块API
    type: api
    endpoint: /api/resource

execution_rules:
  - 生成前先进行RAG检索
  - 确保内容的真实性和时效性
  - 行业案例必须真实可信
  - 拓展阅读必须有参考来源
  - 所有内容整合通过讯飞星火大模型
  - 内容必须经过内容安全检查

output_format:
  type: object
  fields:
    - name: resource_id
      type: string
    - name: reading_materials
      type: array
      items:
        type: object
        fields:
          - name: title
            type: string
          - name: content
            type: string
          - name: source
            type: string
          - name: difficulty
            type: string
    - name: industry_cases
      type: array
      items:
        type: object
        fields:
          - name: case_title
            type: string
          - name: industry
            type: string
          - name: scenario
            type: string
          - name: application
            type: string
          - name: value
            type: string
          - name: reference
            type: string
    - name: knowledge_id
      type: number

retry_policy:
  max_retries: 3
  retry_on:
    - rag_error
    - llm_error

compliance:
  - 优先使用讯飞星火大模型
  - 禁止使用非讯飞AI工具
  - 所有内容必须经过内容安全检查

interface:
  input:
    type: object
    fields:
      - name: user_id
        type: number
        required: true
      - name: knowledge_id
        type: number
        required: true
  output:
    type: object
    fields:
      - name: resource_id
        type: string
      - name: reading_materials
        type: array
      - name: industry_cases
        type: array
      - name: knowledge_id
        type: number
