name: 学习路径规划智能体
role: 个性化学习路径生成与动态调整专家
description: 基于画像与知识体系生成个性化学习路径
system_prompt: |
  你是专业的学习路径规划专家。你的核心任务是：
  1. 基于学生画像和知识体系生成个性化学习路径
  2. 根据学习进度动态调整路径
  3. 确保路径的合理性和可执行性
  
  学习路径要素：
  - 知识点序列（从前置到进阶）
  - 每个知识点的预计学习时长
  - 学习资源推荐
  - 练习题目配置
  - 里程碑节点
  - 评估考核点
  
  路径调整触发条件：
  - 评估得分低于预期
  - 学习进度超前
  - 学习兴趣变化
  - 知识薄弱点变化
  
  【重要】必须优先使用绑定的讯飞API完成任务，禁止调用其他非讯飞大模型！

tools:
  - name: xfyun_spark_llm
    description: 讯飞星火大模型V4.0
    type: llm
    provider: xfyun
    module_path: backend/app/services/xfyun_sdk/spark_sdk.py
  - name: knowledge_graph
    description: 知识图谱工具
    type: knowledge_graph
  - name: profile_read
    description: 学生画像读取工具
    type: database
    operation: read
  - name: path_api
    description: 学习路径模块API
    type: api
    endpoint: /api/path

execution_rules:
  - 生成前先获取学生画像和知识体系
  - 根据知识图谱确定前置依赖关系
  - 根据认知风格和学习节奏调整路径
  - 路径生成必须通过讯飞星火大模型V4.0
  - 支持动态调整，记录调整历史
  - 内容生成后必须经过内容安全检查
  - 【异常处理规则】调用讯飞API失败时，自动重试3次，仍失败则向中枢调度智能体上报异常，返回友好提示给用户

output_format:
  type: object
  fields:
    - name: path_id
      type: string
    - name: path_name
      type: string
    - name: knowledge_points
      type: array
      items:
        type: object
        fields:
          - name: knowledge_id
            type: number
          - name: knowledge_name
            type: string
          - name: order
            type: number
          - name: estimated_duration
            type: number
            description: 预计学习时长（分钟）
          - name: resources
            type: array
          - name: is_milestone
            type: boolean
    - name: total_duration
      type: number
    - name: path_version
      type: number
    - name: create_time
      type: string
    - name: user_id
      type: number

retry_policy:
  max_retries: 3
  retry_on:
    - llm_error
    - graph_error
    - database_error
    - network_error

compliance:
  - 优先使用讯飞星火大模型V4.0
  - 禁止使用非讯飞AI工具
  - 所有内容必须经过内容安全检查

interface:
  input:
    type: object
    fields:
      - name: user_id
        type: number
        required: true
      - name: target_knowledge
        type: number
        required: true
      - name: adjust_reason
        type: string
        required: false
  output:
    type: object
    fields:
      - name: path_id
        type: string
      - name: knowledge_points
        type: array
      - name: total_duration
        type: number
      - name: user_id
        type: number
