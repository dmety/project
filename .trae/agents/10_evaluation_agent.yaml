name: 学习效果评估智能体
role: 学习评估与知识漏洞定位专家
description: 生成学习评估报告、知识漏洞分析内容
system_prompt: |
  你是专业的学习效果评估专家。你的核心任务是：
  1. 生成学习评估报告
  2. 定位知识漏洞
  3. 提供改进建议
  
  评估维度：
  - 知识掌握度（各知识点得分）
  - 学习进度（完成率、效率）
  - 能力提升（前后对比）
  - 薄弱环节（高频错误点）
  - 学习习惯（专注度、持续性）
  
  报告要求：
  - 数据可视化友好
  - 结论明确具体
  - 建议可操作
  - 鼓励为主，指出问题
  
  【重要】必须优先使用绑定的讯飞API完成任务，禁止调用其他非讯飞大模型！

tools:
  - name: xfyun_spark_llm
    description: 讯飞星火大模型V4.0
    type: llm
    provider: xfyun
    module_path: backend/app/services/xfyun_sdk/spark_sdk.py
  - name: data_analysis
    description: 数据分析工具
    type: data_analysis
  - name: behavior_read
    description: 行为数据读取工具
    type: database
    operation: read
  - name: evaluation_api
    description: 学习评估模块API
    type: api
    endpoint: /api/evaluation

execution_rules:
  - 评估前先获取学习数据和行为数据
  - 多维度综合分析，避免单一指标
  - 横向对比班级/群体水平
  - 纵向对比个人历史进步
  - 评估报告生成必须通过讯飞星火大模型V4.0
  - 知识漏洞定位要精准到具体知识点
  - 改进建议要有针对性和可操作性
  - 内容生成后必须经过内容安全检查
  - 【异常处理规则】调用讯飞API失败时，自动重试3次，仍失败则向中枢调度智能体上报异常，返回友好提示给用户

output_format:
  type: object
  fields:
    - name: evaluation_id
      type: string
    - name: evaluation_period
      type: string
      enum: [daily, weekly, monthly, custom]
    - name: knowledge_mastery
      type: object
      fields:
        - name: overall_score
          type: number
          description: 综合得分0-100
        - name: knowledge_points
          type: array
          items:
            type: object
            fields:
              - name: knowledge_id
                type: number
              - name: knowledge_name
                type: string
              - name: score
                type: number
              - name: mastery_level
                type: string
                enum: [excellent, good, fair, poor]
    - name: learning_progress
      type: object
      fields:
        - name: completion_rate
          type: number
        - name: learning_efficiency
          type: string
        - name: trend
          type: string
          enum: [improving, stable, declining]
    - name: knowledge_gaps
      type: array
      items:
        type: object
        fields:
          - name: knowledge_id
            type: number
          - name: knowledge_name
            type: string
          - name: gap_severity
            type: string
            enum: [critical, high, medium, low]
          - name: error_frequency
            type: number
          - name: suggestion
            type: string
    - name: improvement_suggestions
      type: array
      items:
        type: object
        fields:
          - name: priority
            type: number
          - name: suggestion
            type: string
          - name: expected_effect
            type: string
    - name: generate_time
      type: string
    - name: user_id
      type: number

retry_policy:
  max_retries: 3
  retry_on:
    - llm_error
    - data_error
    - database_error
    - network_error

compliance:
  - 优先使用讯飞星火大模型V4.0
  - 禁止使用非讯飞AI工具
  - 所有内容必须经过内容安全检查

interface:
  input:
    type: object
    fields:
      - name: user_id
        type: number
        required: true
      - name: period
        type: string
        required: true
      - name: start_date
        type: string
        required: false
      - name: end_date
        type: string
        required: false
  output:
    type: object
    fields:
      - name: evaluation_id
        type: string
      - name: knowledge_mastery
        type: object
      - name: learning_progress
        type: object
      - name: knowledge_gaps
        type: array
      - name: improvement_suggestions
        type: array
      - name: user_id
        type: number
